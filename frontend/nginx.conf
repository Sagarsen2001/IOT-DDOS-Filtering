# ============================================================
# nginx.conf — Frontend server + API reverse proxy
# ============================================================
# Serves static dashboard files on port 80 and proxies
# /api/ requests to the Flask backend on the Docker network.
# ============================================================

server {
    listen 80;
    server_name localhost;
    absolute_redirect off;

    # ── Static frontend files ─────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # ── Immediate Root Redirect ───────────────────────────────
    location = / {
        return 302 /pages/dashboard.html;
    }

    # ── Reverse proxy: /api/ → Flask backend ──────────────────
    location /api/ {
        proxy_pass         http://backend:5000;
        proxy_http_version 1.1;

        # Forward client info to Flask
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
        proxy_send_timeout    10s;

        # Disable buffering for streaming responses
        proxy_buffering off;
    }

    # ── Frontend page routing ─────────────────────────────────
    # Support browser refreshes on sub-pages (e.g. /pages/alerts.html)
    location / {
        try_files $uri $uri/ /pages/dashboard.html;
    }

    # ── Disable cache for development HTML, CSS, JS ──────────
    location ~* \.(html|css|js)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        expires -1;
    }

    # ── Security headers ──────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}
