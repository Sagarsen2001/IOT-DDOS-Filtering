# docker-compose.yml
# ============================================================
# Runs the Flask backend and Mosquitto MQTT broker together.
#
# Mininet, OVS, and Ryu cannot be containerised reliably —
# they must run on the native Ubuntu host (requires root/kernel modules).
# See README.md → Limitations for details.
#
# Usage:
#   docker compose up --build
#   docker compose down
# ============================================================

version: "3.9"

services:
  # -----------------------------------------------------------
  # Flask backend
  # -----------------------------------------------------------
  backend:
    build: .
    container_name: iot-ddos-backend
    ports:
      - "5000:5000"
    environment:
      - DEMO_MODE=true
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5000
      - MQTT_BROKER_HOST=mosquitto
      - MQTT_BROKER_PORT=1883
      - DATABASE_PATH=/app/data/iot_ddos.db
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
      - ./ml/artifacts:/app/ml/artifacts
    depends_on:
      - mosquitto
    restart: unless-stopped

  # -----------------------------------------------------------
  # Mosquitto MQTT broker
  # -----------------------------------------------------------
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: iot-ddos-mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf
    restart: unless-stopped

volumes:
  data:
